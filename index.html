<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>AquaSentinel AI (SubSea Vision) - Autonomous Underwater Marine Debris & Anomaly Detection System</title>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              ocean: {
                950: '#020B14',
                900: '#041527',
                850: '#08213D',
                800: '#0E3158',
                700: '#17487F',
                cyan: '#00F0FF',
                emerald: '#00E699',
                hazard: '#FF3366',
                warning: '#FFB800'
              }
            },
            fontFamily: {
              sans: ['Inter', 'system-ui', 'sans-serif'],
              hud: ['Orbitron', 'monospace'],
              mono: ['"Fira Code"', 'Consolas', 'monospace'],
              arabic: ['Cairo', 'sans-serif']
            }
          }
        }
      }
    </script>

    <!-- Google Fonts: Inter, Orbitron, Cairo, Fira Code -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=Fira+Code:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=Orbitron:wght@600;700;800;900&display=swap" rel="stylesheet">

    <style>
      body {
        background-color: #020B14;
        color: #E2E8F0;
        font-family: 'Inter', sans-serif;
        overscroll-behavior: none;
      }
      .font-hud { font-family: 'Orbitron', monospace; }
      .font-mono { font-family: 'Fira Code', monospace; }
      .font-arabic { font-family: 'Cairo', sans-serif; }

      /* Glassmorphism Classes */
      .glass-card {
        background: rgba(4, 21, 39, 0.72);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border: 1px solid rgba(0, 240, 255, 0.15);
      }
      .glass-card-hover {
        transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      }
      .glass-card-hover:hover {
        border-color: rgba(0, 240, 255, 0.35);
        box-shadow: 0 12px 30px -10px rgba(0, 240, 255, 0.15);
        transform: translateY(-2px);
      }

      /* Sonar Radar Sweep Animation */
      @keyframes sonar-sweep {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      .sonar-sweep {
        animation: sonar-sweep 4s linear infinite;
        transform-origin: center center;
      }

      /* Underwater caustic shimmer */
      @keyframes ocean-pulse {
        0% { opacity: 0.3; }
        50% { opacity: 0.6; }
        100% { opacity: 0.3; }
      }
      .ocean-pulse {
        animation: ocean-pulse 3s ease-in-out infinite;
      }

      /* Custom Range Slider */
      input[type="range"] {
        -webkit-appearance: none;
        appearance: none;
        background: #0E3158;
        border-radius: 9999px;
        height: 6px;
        outline: none;
      }
      input[type="range"]::-webkit-slider-thumb {
        -webkit-appearance: none;
        appearance: none;
        width: 18px;
        height: 18px;
        border-radius: 50%;
        background: #00F0FF;
        cursor: pointer;
        box-shadow: 0 0 10px rgba(0, 240, 255, 0.6);
        transition: transform 0.15s ease;
      }
      input[type="range"]::-webkit-slider-thumb:hover {
        transform: scale(1.2);
      }

      /* Equalizer Bar Animation */
      @keyframes eq-bounce {
        0%, 100% { height: 4px; }
        50% { height: 16px; }
      }
      .eq-bar-1 { animation: eq-bounce 0.5s ease-in-out infinite 0.1s; }
      .eq-bar-2 { animation: eq-bounce 0.4s ease-in-out infinite 0.25s; }
      .eq-bar-3 { animation: eq-bounce 0.6s ease-in-out infinite 0.05s; }
      .eq-bar-4 { animation: eq-bounce 0.45s ease-in-out infinite 0.3s; }
      .eq-bar-5 { animation: eq-bounce 0.55s ease-in-out infinite 0.15s; }

      @media (prefers-reduced-motion: reduce) {
        *, ::before, ::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
          scroll-behavior: auto !important;
        }
      }
    </style>
  </head>
  <body class="bg-[#020B14] text-slate-100 antialiased selection:bg-cyan-400 selection:text-black">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
